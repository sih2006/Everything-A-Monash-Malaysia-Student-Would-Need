<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student companion prototype</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var look = null;
    try { look = localStorage.getItem('look'); } catch (e) {}
    if (['tropical', 'sticker', 'market', 'classic'].indexOf(look) < 0) look = 'tropical';
    if (look === 'market') t = 'dark'; // the night market look is always dark
    document.documentElement.dataset.look = look;
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow:wght@400;600;700&family=Big+Shoulders+Display:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&family=Gloock&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="looks.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <header class="side">
    <a class="brand" href="#home">[APP NAME]</a>

    <nav class="nav" aria-label="Sections">
      <a href="#home" data-tab="home">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </a>
      <a href="#map" data-tab="map">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>
        <span>Map</span>
      </a>
      <a href="#grades" data-tab="grades">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c2 2.2 10 2.2 12 0v-4.5"/></svg>
        <span>Grades</span>
      </a>
      <a href="#budget" data-tab="budget">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M15.5 14.5h2"/></svg>
        <span>Budget</span>
      </a>
      <a href="#food" data-tab="food">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7a2 2 0 0 0 4 0V3"/><path d="M8 12v9"/><path d="M17 21V3c-2.5 2-3.5 5-3.5 9H17"/></svg>
        <span>Food</span>
      </a>
      <a href="#health" data-tab="health">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>
        <span>Health</span>
      </a>
    </nav>

    <div class="tools">
      <select class="tool" id="lookSelect" aria-label="Choose a look">
        <option value="tropical">Tropical print</option>
        <option value="sticker">Sticker book</option>
        <option value="market">Night market</option>
        <option value="classic">Classic</option>
      </select>
      <button type="button" class="tool" id="toggleGrades" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="toggleGradesLabel">Hide grades</span>
      </button>
      <button type="button" class="tool" id="toggleTheme">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <span id="toggleThemeLabel">Dark mode</span>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>
</div>

<div id="tip" class="tip" role="status" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
